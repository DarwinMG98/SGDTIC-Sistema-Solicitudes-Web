<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Revisión — Recursos compartidos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/formbold-multistep.css') }}">
  <style>
    body { background:#f5f6fa; }
    .formbold-main-wrapper { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:2rem 0; }
    .formbold-form-wrapper { background:#fff; border-radius:12px; box-shadow:0 6px 24px #0001; padding:2rem 2.5rem; max-width:700px; width:100%; }
    .formbold-form-step{display:none;} .formbold-form-step.active{display:block; animation:fadeIn .3s;}
    @keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
    .formbold-step-menu{margin-bottom:2rem;}
    .formbold-step-circle{border-radius:50%; border:2px solid #6366f1; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; margin-right:6px; font-weight:bold;}
    .formbold-step-circle.active{background:#6366f1; color:#fff;}
    .formbold-step-label{font-weight:bold; font-size:1.05rem;}
    .formbold-input-flex{display:flex; gap:1.2rem; flex-wrap:wrap;} .formbold-input-flex>div{flex:1 1 220px;}
    .formbold-form-label{font-weight:bold; display:block; margin:.4rem 0;}
    .formbold-form-input, textarea{width:100%; padding:.6rem .9rem; border:1px solid #ddd; border-radius:8px; background:#f8f9fb;}
    .formbold-btn-group{margin-top:1.2rem;}
  </style>
</head>
<body>

<div class="bg-logo-superior">
  <img src="{{ url_for('static', filename=logo_path) }}" class="decoracion-izquierda">
</div>

<div class="formbold-main-wrapper">
  <div class="formbold-form-wrapper">
    <form method="POST" autocomplete="off">
      <div class="formbold-step-menu">
        <div class="step-indicator"><span class="formbold-step-circle active">1</span><span class="formbold-step-label">Solicitante</span></div>
        <div class="step-indicator"><span class="formbold-step-circle">2</span><span class="formbold-step-label">Recurso</span></div>
        <div class="step-indicator"><span class="formbold-step-circle">3</span><span class="formbold-step-label">Uso</span></div>
        <div class="step-indicator"><span class="formbold-step-circle">4</span><span class="formbold-step-label">Firmas</span></div>
      </div>

      <!-- 1. Solicitante -->
      <div class="formbold-form-step active" id="step-1">
        <h2>Información del Solicitante</h2>
        <label class="formbold-form-label">Nombre del Solicitante</label>
        <input class="formbold-form-input" value="{{ detalle.nombre_completo|default('',true) }}" readonly>

        <div class="formbold-input-flex">
          <div>
            <label class="formbold-form-label">Dependencia/Área</label>
            <input class="formbold-form-input" value="{{ detalle.unidad|default('',true) }}" readonly>
          </div>
          <div>
            <label class="formbold-form-label">Cargo o Puesto</label>
            <input class="formbold-form-input" value="{{ detalle.cargo|default('',true) }}" readonly>
          </div>
        </div>

        <div class="formbold-input-flex">
          <div>
            <label class="formbold-form-label">Correo Electrónico</label>
            <input class="formbold-form-input" value="{{ detalle.correo|default('',true) }}" readonly>
          </div>
          <div>
            <label class="formbold-form-label">Teléfono de Contacto</label>
            <input class="formbold-form-input" value="{{ detalle.telefono|default('',true) }}" readonly>
          </div>
        </div>

        <div class="formbold-btn-group">
          <button type="button" class="formbold-btn" onclick="nextStep(1)">Siguiente →</button>
        </div>
      </div>

      <!-- 2. Recurso -->
      <div class="formbold-form-step" id="step-2">
        <h2>Detalles del Recurso</h2>
        <label class="formbold-form-label">Nombre sugerido del Recurso</label>
        <input class="formbold-form-input" value="{{ detalle.nombre_recurso|default('',true) }}" readonly>

        <label class="formbold-form-label">Ubicación en la estructura</label>
        <input class="formbold-form-input" value="{{ detalle.ubicacion|default('',true) }}" readonly>

        <label class="formbold-form-label">Propósito o Función</label>
        <textarea class="formbold-form-input" rows="2" readonly>{{ detalle.proposito|default('',true) }}</textarea>

        <label class="formbold-form-label">Grupos o Usuarios con Acceso</label>
        <textarea class="formbold-form-input" rows="2" readonly>{{ detalle.usuarios_acceso|default('',true) }}</textarea>

        <label class="formbold-form-label">Nivel de Permisos</label>
        <input class="formbold-form-input" value="{{ detalle.permisos|default('',true) }}" readonly>

        <div class="formbold-btn-group">
          <button type="button" class="formbold-btn formbold-btn-secondary" onclick="prevStep(2)">← Anterior</button>
          <button type="button" class="formbold-btn" onclick="nextStep(2)">Siguiente →</button>
        </div>
      </div>

      <!-- 3. Uso -->
      <div class="formbold-form-step" id="step-3">
        <h2>Uso Estimado y Clasificación</h2><br>

        <label class="formbold-form-label">Tipo de Información a Almacenar</label>
        <input type="text" class="formbold-form-input"
              value="{{ detalle.tipo_informacion|default('', true) }}" readonly>

        <label class="formbold-form-label">Volumen Estimado (GB)</label>
        <input type="text" class="formbold-form-input"
              value="{{ detalle.volumen|default('', true) }}" readonly>

        <label class="formbold-form-label">Tiempo Estimado de Uso (meses/años)</label>
        <input type="text" class="formbold-form-input"
              value="{{ detalle.tiempo_uso|default('', true) }}" readonly>

        <div class="formbold-btn-group">
          <button type="button" class="formbold-btn formbold-btn-secondary" onclick="prevStep(3)">← Anterior</button>
          <button type="button" class="formbold-btn" onclick="nextStep(3)">Siguiente →</button>
        </div>
      </div>


      <!-- 4. Firmas -->
      <div class="formbold-form-step" id="step-4">
        <h2>Firmas y aprobación</h2>

        <div class="formbold-input-flex">
          <div>
            <label class="formbold-form-label">Solicitante</label>
            <input class="formbold-form-input" value="{{ detalle.firma_solicitante|default(detalle.nombre_completo,true) }}" readonly>
          </div>
          <div>
            <label class="formbold-form-label">Cargo</label>
            <input class="formbold-form-input" value="{{ detalle.cargo_solicitante|default(detalle.cargo,true) }}" readonly>
          </div>
        </div>

        <div class="formbold-input-flex">
          <div>
            <label class="formbold-form-label">Nombre del Jefe Inmediato</label>
            <input name="firma_jefe" class="formbold-form-input" required>
          </div>
          <div>
            <label class="formbold-form-label">Cargo del Jefe</label>
            <input name="cargo_jefe" class="formbold-form-input" required>
          </div>
        </div>

        <div class="formbold-btn-group">
          <button type="button" class="formbold-btn formbold-btn-secondary" onclick="prevStep(4)">← Anterior</button>
          <button type="submit" name="accion" value="aprobar" class="formbold-btn">Aprobar</button>
          <button type="button" class="formbold-btn formbold-btn-secondary" onclick="abrirObservacion()">Rechazar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal Rechazo -->
<div id="modalObservacion" class="modal" style="display:none;">
  <div class="modal-contenido">
    <h3>Motivo de Rechazo</h3>
    <form method="POST">
      <textarea name="observacion" rows="5" required placeholder="Escriba el motivo del rechazo..."></textarea>
      <div class="botones-observacion">
        <button type="submit" name="accion" value="rechazar" class="btn-enviar">Enviar</button>
        <button type="button" onclick="cerrarObservacion()" class="btn-cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</div>
<style>
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; z-index:9999;}
  .modal-contenido{background:#fff; padding:2rem; border-radius:12px; box-shadow:0 6px 30px #0003; max-width:480px; width:100%;}
  textarea{width:100%; padding:1rem; resize:none; border-radius:8px; border:1px solid #ccc;}
  .botones-observacion{margin-top:1rem; display:flex; gap:1rem; justify-content:flex-end;}
  .btn-enviar,.btn-cancelar{padding:.5rem 1.5rem; font-weight:bold; border:none; border-radius:6px; cursor:pointer;}
  .btn-enviar{background:#ef4444; color:#fff;} .btn-enviar:hover{background:#dc2626;}
  .btn-cancelar{background:#f3f4f6; color:#374151;}
</style>
<script>
  let currentStep=1;
  function showStep(n){document.querySelectorAll('.formbold-form-step').forEach((el,i)=>el.classList.toggle('active',i===n-1));
                      document.querySelectorAll('.formbold-step-circle').forEach((el,i)=>el.classList.toggle('active',i===n-1));}
  function nextStep(n){ if(n<4){ currentStep=n+1; showStep(currentStep); } }
  function prevStep(n){ if(n>1){ currentStep=n-1; showStep(currentStep); } }
  function abrirObservacion(){ document.getElementById('modalObservacion').style.display='flex'; }
  function cerrarObservacion(){ document.getElementById('modalObservacion').style.display='none'; }
  showStep(1);
</script>
</body>

<a href="{{ url_for('dashboard_admin') }}">
  <img src="{{ url_for('static', filename='img/volver.png') }}" class="volver">
</a>

</html>
